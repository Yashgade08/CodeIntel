name: CodeIntel CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Backend Testing & Linting ───────────────────────────────────
  backend-test:
    name: Backend Tests & Evaluation Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeintel
          POSTGRES_PASSWORD: codeintel_test_password
          POSTGRES_DB: codeintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend

      - name: Run Backend Pytest Suite & Evaluation Tests
        env:
          DATABASE_URL: postgresql+asyncpg://codeintel:codeintel_test_password@localhost:5432/codeintel_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          cd backend
          python -m pytest -v

  # ── Job 2: Frontend Build & Type Validation ────────────────────────────
  frontend-test:
    name: Frontend Build & Typecheck Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Typecheck & Build Bundle
        run: |
          cd frontend
          npm run build

  # ── Job 3: Docker Compose Build Validation ──────────────────────────────
  docker-validation:
    name: Docker Compose Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Docker Images
        run: |
          docker compose build --parallel
