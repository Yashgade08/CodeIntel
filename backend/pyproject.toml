[project]
name = "codeintel-backend"
version = "0.1.0"
description = "CodeIntel — GitHub Repository Intelligence & Codebase Copilot"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Redis
    "redis[hiredis]>=5.1.0",

    # HTTP client
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.4.0",

    # Environment
    "python-dotenv>=1.0.1",

    # Utilities
    "orjson>=3.10.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "transformers>=4.44.0",
    "sentence-transformers>=3.1.0",
]
rag = [
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
]
code-analysis = [
    "tree-sitter>=0.23.0",
    "networkx>=3.3",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
all = [
    "codeintel-backend[ml,rag,code-analysis,dev]",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
